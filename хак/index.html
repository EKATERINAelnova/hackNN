<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Education Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Компонент топбара
    const TopBar = ({ mode, setMode }) => (
      <div className="top-bar">
        <div className="tabs-container">
          <div className="tabs">
            <button className={`tab ${mode === 'student' ? 'active' : ''}`} 
                    onClick={() => setMode('student')}>
              <span className="tab-icon">👨‍🎓</span> Студент
            </button>
            <button className={`tab ${mode === 'admin' ? 'active' : ''}`} 
                    onClick={() => setMode('admin')}>
              <span className="tab-icon">👨‍💼</span> Админ
            </button>
            <div className="tab-indicator" 
                 style={{ left: mode === 'student' ? '5px' : 'calc(50% + 5px)' }} />
          </div>
        </div>
      </div>
    );



    // Компонент статистики
    const StatsCards = () => {
      const stats = [
        { value: 128, label: 'Самарина Татьяна' },
        { value: 87, label: 'Самар Илья Ильич' },
        { value: 42, label: 'Иванов Иван Иванович' },
        { value: 94, label: 'Собрина Валерия Константиновна' }
      ];

      return (
        <div className="stats-grid">
          {stats.map((stat, index) => (
            <div key={index} className="stat-card">
              <div className="stat-value">{stat.value}</div>
              <div className="stat-label">{stat.label}</div>
            </div>
          ))}
        </div>
      );
    };

    const AdminDashboard = () => {
      return (
        <div className="admin-dashboard">
          <StatsCards />
          <ActivityChart />
        </div>
      );
    };

    const App = () => {
      const [mode, setMode] = useState('student');
      
      return (
        <div className="app">
          <TopBar mode={mode} setMode={setMode} />
          <h1>{mode === 'student' ? 'Ваш рейтинг преподавателей' : 'Панель администратора'}</h1>
          <div className="content">
            {mode === 'student' ? <DraggableList /> : <AdminDashboard />}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script type="text/babel" src="draggableList.js"></script>
  <script type="text/babel" src="activityChart.js"></script>
</body>
</html>
