<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оценка преподавателей</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="js/adminPage.js"></script>
  <script type="text/babel" src="js/draggableList.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ChatInterface = () => {
      const [messages, setMessages] = useState([
        { id: 1, text: 'Что вы можете сказать о данном преподавателе?', sender: 'bot' }
      ]);
      const [inputValue, setInputValue] = useState('');
      const [autoDialogStep, setAutoDialogStep] = useState(0);
      const [showSpecialBlock, setShowSpecialBlock] = useState(false);

      // Автоматический диалог
      useEffect(() => {
        const dialogSteps = [
          { delay: 2000, text: ' Преподаватель не самый лучший, темы объясняет непонятно, постоянно переходим с одной на другую', sender: 'user' },
          { delay: 1500, text: 'Насколько логично и систематично преподаватель выстраивает материал в своей лекции?', sender: 'bot' },
          { delay: 2000, text: 'Материал в лекция выстроен крайне нелогично, то, что помогло бы лучше разобраться в теме лекции, объясняется только в сам ом конце', sender: 'user' },
          { delay: 1500, text: 'Легко ли понимать, какие важные моменты преподаватель подчеркивает при изложении материала?', sender: 'bot' },
          { delay: 2000, text: 'Нет, не легко, лекции читает монотонно, без выделения ключевых моментов', sender: 'user' }
        ];

        if (autoDialogStep < dialogSteps.length) {
          const step = dialogSteps[autoDialogStep];
          const timer = setTimeout(() => {
            setMessages(prev => [
              ...prev,
              {
                id: prev.length + 1,
                text: step.text,
                sender: step.sender
              }
            ]);
            setAutoDialogStep(autoDialogStep + 1);
            if (autoDialogStep === dialogSteps.length - 1) {
              setTimeout(() => setShowSpecialBlock(true), 1000);
            }
          }, step.delay);

          return () => clearTimeout(timer);
        }
      }, [autoDialogStep]);

      const handleSendMessage = () => {
        if (inputValue.trim() === '') return;
        
        const newUserMessage = {
          id: messages.length + 1,
          text: inputValue,
          sender: 'user'
        };
        
        setMessages([...messages, newUserMessage]);
        setInputValue('');
        
        setTimeout(() => {
          const botResponse = {
            id: messages.length + 2,
            text: `Я получил ваше сообщение: "${inputValue}"`,
            sender: 'bot'
          };
          setMessages(prev => [...prev, botResponse]);
        }, 1000);
      };

      const handleKeyPress = (e) => {
        if (e.key === 'Enter') {
          handleSendMessage();
        }
      };

      return (
        <div className="chat-container">
          <div className="chat-header">
            <img src="ЛИСИК.svg" alt="Fox" className="bot-avatar" />
            Чат с ассистентом
          </div>
          <div className="chat-messages">
            {messages.map(message => (
              <div 
                key={message.id} 
                className={`message message-${message.sender}`}
              >
                {message.sender === 'bot' && (
                  <img src="ЛИСИК.svg" alt="Fox" className="bot-avatar" />
                )}
                <div className={`message-content ${message.sender}-message`}>
                  {message.text}
                </div>
              </div>
            ))}
          </div>
          {showSpecialBlock && (
            <div className="feedback-block">
              <div className="feedback-header">
                <img className="feedback-icon" alt="fox" src="ЛИСИК.svg"/>
                <h3>Ключевые проблемы в преподавании</h3>
              </div>
              <div className="feedback-keywords">
                <span className="keyword">непонятно</span>
                <span className="keyword">переходит</span>
                <span className="keyword">нелогично</span>
                <span className="keyword">монотонно</span>
                <span className="keyword">без выделения</span>
              </div>
              <div className="feedback-details">
                <h4>Основные недостатки:</h4>
                <ul className="deficiencies-list">
                  <li className="deficiency-item">
                    <span className="deficiency-icon">❌</span>
                    <span>Не объясняет темы понятно</span>
                  </li>
                  <li className="deficiency-item">
                    <span className="deficiency-icon">🔄</span>
                    <span>Резко переходит с одной темы на другую</span>
                  </li>
                  <li className="deficiency-item">
                    <span className="deficiency-icon">🤯</span>
                    <span>Материал в лекции выстроен крайне нелогично</span>
                  </li>
                </ul>
              </div>
            </div>
          )}
          <div className="chat-input">
            <input
              type="text"
              value={inputValue}
              onChange={(e) => setInputValue(e.target.value)}
              onKeyPress={handleKeyPress}
              placeholder="Введите сообщение..."
            />
            <button onClick={handleSendMessage}>Отправить</button>
          </div>
        </div>
      );
    };

    // ТОПБАР
    const TopBar = ({ mode, setMode }) => {
      const getIndicatorPosition = () => {
        switch(mode) {
          case 'student': return '5px';
          case 'chat': return 'calc(33% + 5px)';
          case 'admin': return 'calc(66% + 5px)';
          default: return '5px';
        }
      };

      return (
        <div className="top-bar">
          <div className="tabs-container">
            <div className="tabs">
              <button className={`tab ${mode === 'student' ? 'active' : ''}`} 
                      onClick={() => setMode('student')}>
                <span className="tab-icon">👨‍🎓</span> Студент
              </button>
              <button className={`tab ${mode === 'chat' ? 'active' : ''}`} 
                      onClick={() => setMode('chat')}>
                <span className="tab-icon">💬</span> Чат
              </button>
              <button className={`tab ${mode === 'admin' ? 'active' : ''}`} 
                      onClick={() => setMode('admin')}>
                <span className="tab-icon">👨‍💼</span> Админ
              </button>
              <div className="tab-indicator" style={{ left: getIndicatorPosition() }} />
            </div>
          </div>
        </div>
      );
    };

    // Доп карточки
    const StatsCards = () => {
      const stats = [
        { value: 128, label: 'Самарина Татьяна' },
        { value: 87, label: 'Самар Илья Ильич' },
        { value: 42, label: 'Иванов Иван Иванович' },
        { value: 94, label: 'Собрина Валерия Константиновна' }
      ];

      return (
        <div className="stats-grid">
          {stats.map((stat, index) => (
            <div key={index} className="stat-card">
              <div className="stat-value">{stat.value}</div>
              <div className="stat-label">{stat.label}</div>
            </div>
          ))}
        </div>
      );
    };

    const AdminDashboard = () => {
      return (
        <div className="admin-dashboard">
          <AdminPage />
        </div>
      );
    };

    const App = () => {
      const [mode, setMode] = useState('student');
      
      return (
        <div className="app">
          <TopBar mode={mode} setMode={setMode} />
          <h1>
            {mode === 'student' ? 'Составь свой рейтинг!' : 
             mode === 'chat' ? '' : 'Панель администратора'}
          </h1>
          <div className="content">
            {mode === 'student' ? <DraggableList /> : 
             mode === 'chat' ? <ChatInterface /> : <AdminDashboard />}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
